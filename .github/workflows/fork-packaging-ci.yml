# ai-generated: CI checks for fork-owned packaging and release metadata.
name: Fork packaging CI

on:
  push:
    paths:
      - "packaging/**"
      - "web/**"
      - "FORK.ru.md"
      - "docs/UPSTREAM.ru.md"
      - "docs/TESTPLAN.ru.md"
      - ".github/workflows/fork-*.yml"
      - ".github/workflows/upstream-sync.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "packaging/**"
      - "web/**"
      - "FORK.ru.md"
      - "docs/UPSTREAM.ru.md"
      - "docs/TESTPLAN.ru.md"
      - ".github/workflows/fork-*.yml"
      - ".github/workflows/upstream-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: POSIX shell and release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          find packaging -type f -name '*.sh' -print0 | xargs -0 shellcheck -s sh
          shellcheck -s sh packaging/keenetic/S96olcrtc-native packaging/keenetic/S97olcrtc-web packaging/keenetic/migration.sh packaging/keenetic/rollback.sh

      - name: Test release assembly with dash
        run: sh packaging/release/test-assemble-assets.sh

      - name: Test Debian installer regressions with dash
        run: sh packaging/debian/test-install-server.sh

      - name: Build both platform bundles
        run: |
          mkdir -p build/bundles
          sh packaging/debian/build-bundle.sh build/bundles/olcrtc-debian-amd64.tar.gz
          sh packaging/keenetic/build-bundle.sh build/bundles/olcrtc-keenetic-arm64.tar.gz
          tar -tzf build/bundles/olcrtc-debian-amd64.tar.gz
          tar -tzf build/bundles/olcrtc-keenetic-arm64.tar.gz

      - name: Test release assembly with BusyBox ash
        run: >-
          docker run --rm
          -v "$PWD:/src:ro"
          -w /src
          alpine:3.23
          sh packaging/release/test-assemble-assets.sh

      - name: Test strict Python helpers and web UI
        run: |
          python3 -m unittest discover -s packaging/keenetic -p 'test*.py' -v
          python3 -m unittest discover -s packaging/debian -p 'test*.py' -v
          python3 -m unittest discover -s web/keenetic -p 'test*.py' -v
          if [ -d web/debian ]; then
            python3 -m unittest discover -s web/debian -p 'test*.py' -v
          fi
